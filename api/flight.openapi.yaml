openapi: 3.0.3

info:
  title: Bookinada Flight API
  version: 0.1.0
  description: >
    Search flight offers, view availability, and create reservations
    using synthetic data.
  license:
    name: Proprietary - no license granted

servers:
  - url: http://localhost:3001

security: []

tags:
  - name: Flight offers and reservations
    description: Search flight offers and create flight reservations.

paths:
  /flight-offers:
    get:
      tags:
        - Flight offers and reservations
      operationId: searchFlightOffers
      summary: Search available flight offers
      description: >
        Search by origin, destination, and departure date.
        Leading and trailing whitespace is removed from city names
        before exact, case-sensitive matching.
        Origin and destination must differ after trimming.
        The departure date is interpreted in the origin's local time.
        Return only offers with at least one available seat.
        Searching does not reserve seats.

      parameters:
        - name: origin
          in: query
          required: true
          description: Departure city.
          schema:
            $ref: "#/components/schemas/NonBlankString"
          example: Munich

        - name: destination
          in: query
          required: true
          description: Arrival city.
          schema:
            $ref: "#/components/schemas/NonBlankString"
          example: Berlin

        - name: departureDate
          in: query
          required: true
          description: Departure date in the origin's local time.
          schema:
            $ref: "#/components/schemas/Date"
          example: "2026-11-07"

      responses:
        "200":
          description: Search completed. No matches returns an empty offers array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

        "400":
          description: Missing, blank, or invalid search parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchInputError"

  /flight-offers/{offerId}:
    get:
      tags:
        - Flight offers and reservations
      operationId: getFlightOffer
      summary: Get an offer and its availability
      description: >
        Return an existing offer and its current availability.
        An existing but unavailable offer returns 200
        with availableForBooking false.

      parameters:
        - name: offerId
          in: path
          required: true
          description: Identifier of the flight offer.
          schema:
            $ref: "#/components/schemas/NonBlankString"
          example: flight-offer-001

      responses:
        "200":
          description: Offer found and availability checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferDetails"

        "404":
          $ref: "#/components/responses/OfferNotFound"

  /flight-reservations:
    post:
      tags:
        - Flight offers and reservations
      operationId: createFlightReservation
      summary: Create a flight reservation
      description: >
        Reserve one seat for the specified offer.
        Availability must be checked again when creating the reservation.
        Creating the reservation and updating seat inventory must be atomic
        within the flight service.
        A rejected request must not change inventory or create a reservation.
        travellerId is a synthetic identity, not proof of authentication.
        Repeated requests are not guaranteed to be idempotent.
        A confirmed flight reservation does not confirm a hotel reservation.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
            example:
              travellerId: traveller-001
              offerId: flight-offer-001

      responses:
        "201":
          description: Reservation created and seat inventory updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"

        "400":
          description: Missing, blank, or invalid reservation fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationInputError"

        "404":
          $ref: "#/components/responses/OfferNotFound"

        "409":
          description: No seat is available for the requested offer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableError"

components:
  responses:
    OfferNotFound:
      description: No offer exists with the specified offerId.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OfferNotFoundError"

  schemas:
    Date:
      type: string
      format: date
      example: "2026-11-07"

    NonBlankString:
      type: string
      minLength: 1
      pattern: '\S'

    Offer:
      type: object
      additionalProperties: false
      required:
        - offerId
        - flightId
        - origin
        - destination
        - departureDate
      properties:
        offerId:
          $ref: "#/components/schemas/NonBlankString"
        flightId:
          $ref: "#/components/schemas/NonBlankString"
        origin:
          $ref: "#/components/schemas/NonBlankString"
        destination:
          $ref: "#/components/schemas/NonBlankString"
        departureDate:
          $ref: "#/components/schemas/Date"

    SearchResult:
      type: object
      additionalProperties: false
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/Offer"

    OfferDetails:
      type: object
      additionalProperties: false
      required:
        - offerId
        - flightId
        - origin
        - destination
        - departureDate
        - availableForBooking
      properties:
        offerId:
          $ref: "#/components/schemas/NonBlankString"
        flightId:
          $ref: "#/components/schemas/NonBlankString"
        origin:
          $ref: "#/components/schemas/NonBlankString"
        destination:
          $ref: "#/components/schemas/NonBlankString"
        departureDate:
          $ref: "#/components/schemas/Date"
        availableForBooking:
          type: boolean
          description: Whether at least one seat is currently available.

    CreateReservationRequest:
      type: object
      additionalProperties: false
      required:
        - travellerId
        - offerId
      properties:
        travellerId:
          $ref: "#/components/schemas/NonBlankString"
        offerId:
          $ref: "#/components/schemas/NonBlankString"

    Reservation:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - travellerId
        - offerId
        - flightId
        - origin
        - destination
        - departureDate
        - status
      properties:
        reservationId:
          $ref: "#/components/schemas/NonBlankString"
        travellerId:
          $ref: "#/components/schemas/NonBlankString"
        offerId:
          $ref: "#/components/schemas/NonBlankString"
        flightId:
          $ref: "#/components/schemas/NonBlankString"
        origin:
          $ref: "#/components/schemas/NonBlankString"
        destination:
          $ref: "#/components/schemas/NonBlankString"
        departureDate:
          $ref: "#/components/schemas/Date"
        status:
          type: string
          enum:
            - confirmed

    SearchInputError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - INVALID_SEARCH_REQUEST
            message:
              $ref: "#/components/schemas/NonBlankString"

    ReservationInputError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - INVALID_RESERVATION_REQUEST
            message:
              $ref: "#/components/schemas/NonBlankString"

    OfferNotFoundError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - OFFER_NOT_FOUND
            message:
              $ref: "#/components/schemas/NonBlankString"

    UnavailableError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - FLIGHT_UNAVAILABLE
            message:
              $ref: "#/components/schemas/NonBlankString"
