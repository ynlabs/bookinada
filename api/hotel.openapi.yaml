openapi: 3.0.3

info:
  title: Bookinada Hotel API
  version: 0.1.0
  description: >
    Search hotel offers, view availability, and create reservations
    using synthetic data.
  license:
    name: Proprietary - no license granted

servers:
  - url: http://localhost:3002

security: []

tags:
  - name: Hotel offers and reservations
    description: Search hotel offers and manage hotel reservations.

paths:
  /hotel-offers:
    get:
      tags:
        - Hotel offers and reservations
      operationId: searchHotelOffers
      summary: Search available hotel offers
      description: >
        Search by destination and stay dates.
        Each returned offer must have one room of the same room type
        available for every occupied night.
        checkOut must be after checkIn.
        Searching does not reserve inventory.

      parameters:
        - name: destination
          in: query
          required: true
          description: Destination to search.
          schema:
            $ref: "#/components/schemas/NonBlankString"
          example: Munich

        - $ref: "#/components/parameters/CheckIn"
        - $ref: "#/components/parameters/CheckOut"

      responses:
        "200":
          description: Search completed. No matches returns an empty offers array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

        "400":
          $ref: "#/components/responses/InvalidSearch"

  /hotel-offers/{offerId}:
    get:
      tags:
        - Hotel offers and reservations
      operationId: getHotelOffer
      summary: Get an offer and its availability
      description: >
        Return an existing offer and its availability for the requested stay.
        An existing but unavailable offer returns 200 with availableForStay false.
        checkOut must be after checkIn.

      parameters:
        - name: offerId
          in: path
          required: true
          description: Identifier of the hotel offer.
          schema:
            $ref: "#/components/schemas/NonBlankString"
          example: hotel-offer-001

        - $ref: "#/components/parameters/CheckIn"
        - $ref: "#/components/parameters/CheckOut"

      responses:
        "200":
          description: Offer found and availability checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferDetails"

        "400":
          $ref: "#/components/responses/InvalidSearch"

        "404":
          $ref: "#/components/responses/OfferNotFound"

  /hotel-reservations:
    post:
      tags:
        - Hotel offers and reservations
      operationId: createHotelReservation
      summary: Create a hotel reservation
      description: >
        Reserve one room for each occupied night from checkIn up to,
        but excluding, checkOut.
        checkOut must be after checkIn.
        Availability must be checked again when creating the reservation.
        Creating the reservation and updating inventory must be atomic
        within the hotel service.
        A rejected request must not change inventory or create a reservation.
        travellerId is a synthetic identity, not proof of authentication.
        Repeated requests are not guaranteed to be idempotent.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
            example:
              travellerId: traveller-001
              offerId: hotel-offer-001
              checkIn: "2026-11-07"
              checkOut: "2026-11-09"

      responses:
        "201":
          description: Reservation created and inventory updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"

        "400":
          description: Missing, blank, or invalid reservation fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationInputError"

        "404":
          $ref: "#/components/responses/OfferNotFound"

        "409":
          description: The requested room is unavailable for one or more nights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableError"

components:
  parameters:
    CheckIn:
      name: checkIn
      in: query
      required: true
      description: First occupied night.
      schema:
        $ref: "#/components/schemas/Date"
      example: "2026-11-07"

    CheckOut:
      name: checkOut
      in: query
      required: true
      description: Departure date, excluded from the stay; must be after checkIn.
      schema:
        $ref: "#/components/schemas/Date"
      example: "2026-11-09"

  responses:
    InvalidSearch:
      description: Missing, blank, or invalid search parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchInputError"

    OfferNotFound:
      description: No offer exists with the specified offerId.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OfferNotFoundError"

  schemas:
    Date:
      type: string
      format: date
      example: "2026-11-07"

    NonBlankString:
      type: string
      minLength: 1
      pattern: '\S'

    Offer:
      type: object
      additionalProperties: false
      required:
        - offerId
        - hotelId
        - hotelName
        - destination
        - roomTypeId
        - checkIn
        - checkOut
      properties:
        offerId:
          $ref: "#/components/schemas/NonBlankString"
        hotelId:
          $ref: "#/components/schemas/NonBlankString"
        hotelName:
          $ref: "#/components/schemas/NonBlankString"
        destination:
          $ref: "#/components/schemas/NonBlankString"
        roomTypeId:
          $ref: "#/components/schemas/NonBlankString"
        checkIn:
          $ref: "#/components/schemas/Date"
        checkOut:
          $ref: "#/components/schemas/Date"

    SearchResult:
      type: object
      additionalProperties: false
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/Offer"

    OfferDetails:
      type: object
      additionalProperties: false
      required:
        - offerId
        - hotelId
        - hotelName
        - destination
        - roomTypeId
        - checkIn
        - checkOut
        - availableForStay
      properties:
        offerId:
          $ref: "#/components/schemas/NonBlankString"
        hotelId:
          $ref: "#/components/schemas/NonBlankString"
        hotelName:
          $ref: "#/components/schemas/NonBlankString"
        destination:
          $ref: "#/components/schemas/NonBlankString"
        roomTypeId:
          $ref: "#/components/schemas/NonBlankString"
        checkIn:
          $ref: "#/components/schemas/Date"
        checkOut:
          $ref: "#/components/schemas/Date"
        availableForStay:
          type: boolean
          description: Whether one room is available for every occupied night.

    CreateReservationRequest:
      type: object
      additionalProperties: false
      required:
        - travellerId
        - offerId
        - checkIn
        - checkOut
      properties:
        travellerId:
          $ref: "#/components/schemas/NonBlankString"
        offerId:
          $ref: "#/components/schemas/NonBlankString"
        checkIn:
          $ref: "#/components/schemas/Date"
        checkOut:
          $ref: "#/components/schemas/Date"

    Reservation:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - travellerId
        - offerId
        - checkIn
        - checkOut
        - status
      properties:
        reservationId:
          $ref: "#/components/schemas/NonBlankString"
        travellerId:
          $ref: "#/components/schemas/NonBlankString"
        offerId:
          $ref: "#/components/schemas/NonBlankString"
        checkIn:
          $ref: "#/components/schemas/Date"
        checkOut:
          $ref: "#/components/schemas/Date"
        status:
          type: string
          enum:
            - confirmed

    SearchInputError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - INVALID_SEARCH_REQUEST
            message:
              $ref: "#/components/schemas/NonBlankString"

    ReservationInputError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - INVALID_RESERVATION_REQUEST
            message:
              $ref: "#/components/schemas/NonBlankString"

    OfferNotFoundError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - OFFER_NOT_FOUND
            message:
              $ref: "#/components/schemas/NonBlankString"

    UnavailableError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - ACCOMMODATION_UNAVAILABLE
            message:
              $ref: "#/components/schemas/NonBlankString"
