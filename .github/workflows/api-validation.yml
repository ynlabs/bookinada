name: API contract validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-openapi:
    name: Validate Hotel and Flight OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate both API contracts
        run: npm run lint:api
