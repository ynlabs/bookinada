<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc">
<title id="title">Bookinada system context — Week 1 proposal</title>
<desc id="desc">A traveller searches, books, and views reservation status in Bookinada. Bookinada manages synthetic inventory internally and has a planned dependency on a separate local or test blockchain network under assumption A3.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker></defs>
<rect width="1280" height="510" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<text x="640" y="48" font-size="27" fill="#0f172a">Bookinada — System Context</text>
<text x="640" y="78" font-size="16" fill="#475569">Week 1 proposal · planned relationships are dashed</text>
<rect x="30" y="180" width="210" height="130" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<text x="135" y="214" font-size="14" fill="#475569">[Person]</text>
<text x="135" y="246" font-size="23" fill="#0f172a">Traveller</text>
<text x="135" y="277" font-size="16" fill="#334155">Plans and books trips</text>
<rect x="435" y="145" width="330" height="200" rx="9" fill="#17558c" stroke="#103f69" stroke-width="2"/>
<text x="600" y="180" font-size="14" fill="#dbeafe">[Software System]</text>
<text x="600" y="216" font-size="27" fill="white">Bookinada</text>
<text x="600" y="247" font-size="16" fill="white">Search, reserve, recommend</text>
<text x="600" y="275" font-size="16" fill="white">Manage status and notifications</text>
<text x="600" y="310" font-size="14" fill="#dbeafe">Synthetic inventory is internal (A1)</text>
<rect x="975" y="175" width="270" height="140" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1110" y="204" font-size="14" fill="#475569">[External Software System]</text>
<text x="1110" y="238" font-size="22" fill="#0f172a">Blockchain network</text>
<text x="1110" y="268" font-size="16" fill="#334155">Local/test network</text>
<text x="1110" y="293" font-size="14" fill="#475569">Planned · assumption A3</text>
<path d="M240 245 H432" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="337" y="180" font-size="15" fill="#334155">Searches / reserves</text>
<text x="337" y="202" font-size="15" fill="#334155">Gets recommendations,</text>
<text x="337" y="224" font-size="15" fill="#334155">results and updates</text>
<path d="M765 245 H972" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="870" y="180" font-size="15" fill="#334155">Submits / queries</text>
<text x="870" y="202" font-size="15" fill="#334155">smart-contract bookings</text>
<text x="870" y="224" font-size="15" fill="#334155">(planned)</text>
<text x="640" y="400" font-size="16" fill="#334155">Bookinada is one system here. Internal services, databases, and frameworks are omitted.</text>
<text x="640" y="432" font-size="15" fill="#475569">No live supplier, payment, notification-provider, or external LLM dependency is assumed.</text>
<text x="640" y="477" font-size="14" fill="#64748b">Basis: Exercise 0, pp. 13–15 · External network placement is an explicit design assumption.</text>
</g></svg>